services:
  # ── Reverse Proxy ──────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      # FINDING-010: the Caddyfile site address is `{$DOMAIN}` — Caddy needs
      # DOMAIN in its own environment (previously only the backend got it).
      - .env
    volumes:
      # FINDING-010: overridable so local development can opt into the
      # plaintext docker/Caddyfile.dev without editing this file — set
      # CADDY_CONFIG_FILE=./docker/Caddyfile.dev in your local .env. Not the
      # default.
      - ${CADDY_CONFIG_FILE:-./docker/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - oasis_net

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: oasis-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - oasis_net

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: oasis-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # FINDING-006: overrides any REDIS_URL in .env so the backend always
      # connects to Redis with the same password docker-compose configures
      # below via `--requirepass`, without operators needing to hand-embed
      # the password into REDIS_URL themselves.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/recordings:/data/oasis-recordings
    networks:
      - oasis_net
    # FINDING-009: bound the container's memory so a single oversized
    # request (or any other single-process runaway) cannot exhaust host
    # memory and kill every other service, including in-flight interview
    # pipelines running in this same process.
    mem_limit: 2g
    memswap_limit: 2g

  # ── PostgreSQL (with pgvector for RAG embeddings) ─────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oasis}
      # FINDING-011: fail the whole stack closed rather than start Postgres
      # with the guessable published default — same treatment REDIS_PASSWORD
      # already has below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-oasis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oasis}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - oasis_net

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # FINDING-006: require a password (fails the whole stack closed rather
    # than starting Redis unauthenticated with a silent default), and
    # disable the commands the app never needs and an attacker with network
    # access to Redis would want most (full keyspace dump / wipe).
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — see .env.example}
      --rename-command CONFIG ""
      --rename-command KEYS ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - oasis_net

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  # FINDING-015: a fixed subnet so the backend's TRUSTED_PROXY_IPS default
  # (172.28.0.0/24, app/config.py) reliably covers whatever address Caddy
  # gets assigned on this network — Compose's default (unpinned) bridge
  # subnet is not guaranteed to be the same range across hosts/restarts.
  oasis_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
